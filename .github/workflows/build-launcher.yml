name: Build iDroid (Lawnchair base)

on:
  push:
    branches: [main]
    paths:
      - ".gitmodules"
      - "upstream/lawnchair"
      - ".github/workflows/build-launcher.yml"
      - "docs/LAUNCHER_BASE.md"
      - "docs/IOS26_DESIGN_SPEC.md"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-lawnchair-base:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout iDroid and Lawnchair source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Verify pinned upstream checkout
        working-directory: upstream/lawnchair
        run: |
          test "$(git rev-parse HEAD)" = "6f4a81266c8d86361496a035d3080c2ebcb4886a"
          git submodule status --recursive
          test -f gradlew
          test -f prebuilts/libs/framework-14.jar

      - name: Apply iDroid launcher overlay
        run: python3 scripts/apply-idroid-overlay.py

      - name: Build iDroid with Lawnchair 14 and Quickstep
        working-directory: upstream/lawnchair
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleLawnWithQuickstepGithubDebug

      - name: Upload iDroid debug APK
        uses: actions/upload-artifact@v4
        with:
          name: idroid-launcher-debug
          path: upstream/lawnchair/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
